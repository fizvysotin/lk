const isSection = t => /^#\s*/.test(t);
const secTitle = t => t.replace(/^#\s*/, '');

function buildTopics(lines) {
  return lines.map(t => ({ id: 't' + uid(), t: t }));
}
function seedPrograms() {
  return PROGRAM_SEED.map(p => ({
    id: 'p' + uid(), name: p.name, exam: p.exam, subject: p.subject,
    topics: buildTopics(p.count ? Array.from({ length: p.count }, (_, i) => 'Задание №' + (i + 1)) : p.topics)
  }));
}
const programs = () => (DB.programs || []);
const programOf = id => programs().find(p => p.id === id);
const realTopics = p => (p ? p.topics.filter(t => !isSection(t.t)) : []);

/** Программа ученика: явно выбранная или подходящая по предмету и цели */
function studentProgram(s) {
  if (s.programId) { const p = programOf(s.programId); if (p) return p; }
  const subj = (s.subjects || [])[0] || 'Ф';
  const exam = s.goal === 'ОГЭ' ? 'ОГЭ' : (s.goal === 'ЕГЭ' ? 'ЕГЭ' : null);
  if (!exam) return null;
  return programs().find(p => p.exam === exam && p.subject === subj) || null;
}
function doneMap(s) { if (!s.topics) s.topics = {}; return s.topics; }
function doneCount(s, p) { const d = doneMap(s); return realTopics(p).filter(t => d[t.id]).length; }

let topicsOpen = false;

const dateText = v => (typeof v === 'string' && /^\d{4}-/.test(v)) ? fmtDate(parseKey(v)) : '';

/** Панель со списком тем ученика (сворачиваемая) */
function topicsPanel(s) {
  const p = studentProgram(s);
  if (!programs().length) return '<div class="empty small">Программы ещё не настроены</div>';
  const sel = `<select id="tpProgram" data-sid="${s.id}" style="max-width:230px">
      <option value="">— программа не выбрана —</option>
      ${programs().map(x => `<option value="${x.id}" ${p && x.id === p.id ? 'selected' : ''}>${esc(x.name)} · ${realTopics(x).length} тем</option>`).join('')}
    </select>`;

  const d = doneMap(s);
  const total = p ? realTopics(p).length : 0;
  const done = p ? doneCount(s, p) : 0;
  const pct = total ? Math.round(done / total * 100) : 0;

  let body;
  if (!p) {
    body = `<div style="margin-bottom:10px">${sel}</div>
      <div class="empty small">Выберите программу — появится список тем</div>`;
  } else {
    let n = 0;
    const rows = p.topics.map(t => {
      if (isSection(t.t)) return `<div class="topic-sec">${esc(secTitle(t.t))}</div>`;
      n++;
      const on = !!d[t.id];
      return `<label class="topic ${on ? 'done' : ''}">
        <input type="checkbox" data-topic="${t.id}" data-sid="${s.id}" ${on ? 'checked' : ''}>
        <span class="topic-n">${n}</span>
        <span class="topic-t">${esc(t.t)}</span>
        <span class="topic-d">${on ? `<span class="date-chip" data-dfor="${t.id}" data-sid="${s.id}" title="Изменить дату">${esc(dateText(d[t.id]) || 'дата')}</span>` : ''}</span>
      </label>`;
    }).join('');
    body = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        ${sel}<span class="muted small">Дату можно изменить — нажмите на неё</span>
      </div>
      <div class="topics">${rows}</div>`;
  }

  return `<details class="topics-box" ${topicsOpen ? 'open' : ''}>
    <summary>
      <span class="tb-title">Пройденные темы</span>
      <span class="tb-sum" data-tp-sum>${p ? done + ' из ' + total + ' · ' + pct + '%' : 'программа не выбрана'}</span>
      <span class="tb-bar"><i data-tp-bar style="width:${pct}%"></i></span>
      <span class="tb-hint">развернуть</span>
    </summary>
    <div class="topics-body">${body}</div>
  </details>`;
}

/** Точечно обновить счётчик и полосу прогресса — без перерисовки списка */
function updateTopicsProgress(s) {
  const p = studentProgram(s); if (!p) return;
  const total = realTopics(p).length, done = doneCount(s, p);
  const pct = total ? Math.round(done / total * 100) : 0;
  const sum = document.querySelector('[data-tp-sum]');
  const bar = document.querySelector('[data-tp-bar]');
  if (sum) sum.textContent = done + ' из ' + total + ' · ' + pct + '%';
  if (bar) bar.style.width = pct + '%';
}

/** Клик по дате — редактор даты прямо в строке */
function bindDateChip(chip) {
  chip.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    const s = student(chip.dataset.sid); if (!s) return;
    const tid = chip.dataset.dfor;
    const cur = doneMap(s)[tid];
    const inp = document.createElement('input');
    inp.type = 'date';
    inp.className = 'date-inline';
    inp.value = (typeof cur === 'string' && /^\d{4}-/.test(cur)) ? cur : todayKey();
    chip.replaceWith(inp);
    inp.focus();
    if (inp.showPicker) { try { inp.showPicker(); } catch (e) { } }
    let closed = false;
    const finish = () => {
      if (closed) return; closed = true;
      doneMap(s)[tid] = inp.value || todayKey();
      save();
      const c = document.createElement('span');
      c.className = 'date-chip';
      c.dataset.dfor = tid; c.dataset.sid = s.id;
      c.title = 'Изменить дату';
      c.textContent = dateText(doneMap(s)[tid]) || 'дата';
      inp.replaceWith(c);
      bindDateChip(c);
    };
    inp.onchange = finish;
    inp.onblur = finish;
    inp.onkeydown = e => { if (e.key === 'Enter' || e.key === 'Escape') finish(); };
  };
}

/** Обработчики панели тем (вызывать после вставки в DOM) */
function wireTopics(after) {
  const box = document.querySelector('.topics-box');
  if (box) box.ontoggle = () => { topicsOpen = box.open; };

  $$('[data-topic]').forEach(cb => cb.onchange = () => {
    const s = student(cb.dataset.sid); if (!s) return;
    const d = doneMap(s);
    const label = cb.closest('.topic');
    if (cb.checked) d[cb.dataset.topic] = todayKey(); else delete d[cb.dataset.topic];
    save();
    // обновляем только эту строку и счётчик — страница не дёргается
    label.classList.toggle('done', cb.checked);
    const slot = $('.topic-d', label);
    if (slot) {
      slot.innerHTML = cb.checked
        ? '<span class="date-chip" data-dfor="' + cb.dataset.topic + '" data-sid="' + s.id + '" title="Изменить дату">'
        + esc(dateText(d[cb.dataset.topic]) || 'дата') + '</span>' : '';
      const chip = $('.date-chip', slot);
      if (chip) bindDateChip(chip);
    }
    updateTopicsProgress(s);
  });

  $$('.date-chip').forEach(bindDateChip);

  const sel = $('#tpProgram');
  if (sel) sel.onchange = () => {
    const s = student(sel.dataset.sid); if (!s) return;
    s.programId = sel.value || null;
    topicsOpen = true;
    save();
    if (after) after(); else render(true);
  };
}

      <div class="muted small" id="pgCount"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Отмена</button>
      <button class="btn btn-primary" id="pgSave">Сохранить</button></div>`);

    const lines = $('#pgTopics').value.split('\n').map(x => x.trim()).filter(Boolean);
    $('#pgCount').textContent = 'Тем: ' + lines.filter(x => !isSection(x)).length
      + ' · разделов: ' + lines.filter(isSection).length;

    if (!name) { toast('Введите название программы'); return; }
    const lines = $('#pgTopics').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) { toast('Добавьте хотя бы одну тему'); return; }

    const old = p ? p.topics.slice() : [];
    const usedOld = {};
    // сначала по совпадению названия, потом по месту в списке — так отметки переживают
    // и перестановку, и переименование темы
    const next = lines.map((line, i) => {
      const byText = old.find(o => o.t === line && !usedOld[o.id]);

      return { id: null, t: line, i: i };

}
/* =========================================================
   ДОСТУП УЧЕНИКА
   В кабинет ученика уходит заранее собранный срез: без цен,
   без оплат и без данных других учеников. Всё, что ученик
   вообще может запросить с сервера, — это одна его строка.
   ========================================================= */

const PUPIL_DOMAIN = 'pupil.local';
const pupilUrl = () => location.origin + location.pathname.replace(/[^/]*$/, '') + 's/';

function accessMap() { if (!DB.access) DB.access = {}; return DB.access; }
function accessOf(s) { return accessMap()[s.id] || null; }
function groupsOf(sid) { return (DB.groups || []).filter(g => !g.archived && (g.studentIds || []).indexOf(sid) >= 0); }

const pupilCache = {};

/* ---------- сбор среза ---------- */

function pupilLessons(s) {
  const now = new Date();
  const from = key(new Date(now.getFullYear(), now.getMonth() - 2, 1));
  const to = key(addDays(now, 90));
  const gs = groupsOf(s.id);
  const gid = {}; gs.forEach(g => gid[g.id] = g.name);
  return occurrences(from, to)
    .filter(o => (o.kind === 'group' ? gid[o.refId] != null : o.refId === s.id))
    .map(o => ({
      d: o.date, t: o.time, dur: o.dur || 60,
      subj: o.subject || '', st: o.st || 'plan',
      g: o.kind === 'group' ? (gid[o.refId] || '') : ''
    }));
}

/** Данные одного ученика. Ничего лишнего сюда попасть не должно. */
function pupilPayload(s) {
  const p = studentProgram(s);
  return {
    v: 1,
    name: s.name,
    grade: s.grade || null,
    goal: s.goal || '',
    subjects: s.subjects || [],
    tutor: DB.settings.owner || '',
    lessons: pupilLessons(s),
    hw: (DB.hw || []).filter(h => h.studentId === s.id).map(h => ({
      id: h.id, date: h.date || null, due: h.due || null, text: h.text || '',
      done: !!h.done, doneAt: h.doneAt || null, grade: h.grade || null
    })),
    works: (DB.works || []).filter(w => w.studentId === s.id).map(w => ({
      id: w.id, date: w.date || null, title: w.title || '', type: w.type || '',
      exam: w.exam || '', scale: w.scale || 5, grade: w.grade == null ? null : w.grade,
      tasks: (w.tasks || []).map(t => ({ n: t.n, max: t.max, got: t.got })),
      note: w.note || ''
    })),
    program: p ? { name: p.name, topics: p.topics.map(t => ({ id: t.id, t: t.t })) } : null,
    topics: s.topics || {},
    files: (DB.files || []).map(f => ({ k: f.k, n: f.n, s: f.s, d: f.d })),
    links: (DB.links || []).map(l => ({ name: l.name, url: l.url, note: l.note || '' }))
  };
}

/** Выгрузить срезы всех учеников, у которых есть доступ (только изменившиеся) */
async function pushPupils(force) {
  if (!cloudOn() || !AUTH.s) return;
  const ids = Object.keys(accessMap());
  if (!ids.length) return;
  const rows = [];
  ids.forEach(sid => {
    const s = student(sid);
    if (!s) return;
    const pl = pupilPayload(s);
    const j = JSON.stringify(pl);
    if (!force && pupilCache[sid] === j) return;
    pupilCache[sid] = j;
    rows.push({ tutor: AUTH.uid(), sid: sid, data: pl, updated_at: new Date().toISOString() });
  });
  if (!rows.length) return;
  try {
    const r = await api('/rest/v1/pupil_data', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(rows)
    });
    if (!r.ok) rows.forEach(x => delete pupilCache[x.sid]);
  } catch (e) {
    rows.forEach(x => delete pupilCache[x.sid]);
  }
}

/* ---------- выдача и отзыв доступа ---------- */

const PASS_ABC = 'abcdefghjkmnpqrstuvwxyz23456789';
function genPass(n) {
  let out = '';
  for (let i = 0; i < (n || 8); i++) out += PASS_ABC.charAt(Math.floor(Math.random() * PASS_ABC.length));
  return out.slice(0, 4) + '-' + out.slice(4);
}
function genLogin(name) {
  const base = translit(name).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12) || 'uchenik';
  let tail = '';
  for (let i = 0; i < 4; i++) tail += PASS_ABC.charAt(Math.floor(Math.random() * PASS_ABC.length));
  return base + tail + '@' + PUPIL_DOMAIN;
}

async function grantAccess(s) {
  const login = genLogin(s.name), pass = genPass();
  const r = await fetch(CLOUD.url + '/auth/v1/signup', {
    method: 'POST',
    headers: { apikey: CLOUD.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: login, password: pass })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(authError(j));
  const uidNew = (j.user && j.user.id) || j.id;
  if (!uidNew) throw new Error('Сервер не вернул идентификатор аккаунта');
  const rr = await api('/rest/v1/pupil', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates' },
    body: JSON.stringify({ uid: uidNew, tutor: AUTH.uid(), sid: s.id, login: login })
  });
  if (!rr.ok) throw new Error('Не удалось привязать аккаунт (код ' + rr.status + ')');
  accessMap()[s.id] = { uid: uidNew, login: login, at: todayKey() };
  save();
  delete pupilCache[s.id];
  await pushPupils();
  return { login: login, pass: pass };
}

async function revokeAccess(s) {
  const a = accessOf(s);
  if (!a) return;
  await api('/rest/v1/pupil?uid=eq.' + a.uid, { method: 'DELETE' });
  await api('/rest/v1/pupil_data?tutor=eq.' + AUTH.uid() + '&sid=eq.' + encodeURIComponent(s.id), { method: 'DELETE' });
  delete accessMap()[s.id];
  delete pupilCache[s.id];
  save();
}

/* =========================================================

function debtRange() { return [key(addDays(new Date(), -365)), todayKey()]; }

function viewMoney() {
  const [from, to] = debtRange();
  const occ = occurrences(from, to).filter(isCharged);
  const unpaid = occ.filter(o => !o.paid).reverse();
  const t = totals(occ);
  const tm = totals(monthOcc(dashMonth));

  // долги считаем по каждому ученику: доля в группе — своя у каждого
  const byStudent = {};
  occ.forEach(o => {
    o.members.forEach(id => {
      if (!byStudent[id]) byStudent[id] = {
        id: id, name: (student(id) || {}).name || 'Ученик', charged: 0, paid: 0, n: 0, nUnpaid: 0, last: '', groups: {}
      };
      const r = byStudent[id];
      r.charged += o.perOne; r.n++;
      if (o.payMap[id]) r.paid += o.perOne; else r.nUnpaid++;
      if (o.kind === 'group') r.groups[targetName(o.kind, o.refId)] = 1;
      if (o.date > r.last) r.last = o.date;
    });
  });
  const rows = Object.values(byStudent).map(r => (r.debt = r.charged - r.paid, r)).sort((a, b) => b.debt - a.debt || b.charged - a.charged);
  // список неоплаченных: отдельная строка на каждого должника занятия
  const owed = [];
  occ.slice().reverse().forEach(o => o.members.forEach(id => { if (!o.payMap[id]) owed.push({ o: o, id: id }); }));

  $('#app').innerHTML = `
  <div class="page-head">
    <div><h2>Оплаты и долги</h2><div class="sub">За последние 12 месяцев · начисляются только проведённые и пропущенные занятия</div></div>
    <button class="btn btn-sm" id="expDebt">⬇ CSV долгов</button>
  </div>
  <div class="grid cols-4" style="margin-bottom:14px">
    <div class="stat"><div class="label">Общий долг</div><div class="value" style="${t.debt ? 'color:var(--st-crit)' : ''}">${moneyShort(t.debt)}<small> ₽</small></div>
      <div class="delta">${owed.length} ${plural(owed.length, 'оплата', 'оплаты', 'оплат')} не отмечено</div></div>
    <div class="stat"><div class="label">Получено за ${MONTHS_N[+dashMonth.slice(5, 7) - 1].toLowerCase()}</div><div class="value">${moneyShort(tm.received)}<small> ₽</small></div>
      <div class="delta">из ${money(tm.charged)} начисленных</div></div>
    <div class="stat"><div class="label">Собираемость</div><div class="value">${t.charged ? Math.round(t.received / t.charged * 100) : 100}%</div>
      <div class="delta">оплачено ${money(t.received)} за год</div></div>
    <div class="stat"><div class="label">Налог за год (${DB.settings.taxRate}%)</div><div class="value">${moneyShort(t.tax)}<small> ₽</small></div>
      <div class="delta">с начисленных ${moneyShort(t.charged)} ₽</div></div>
  </div>

  <div class="card">
    <div class="card-head"><div><div class="card-title">По ученикам</div>
      <div class="card-sub">Занятия в группе делятся поровну — у каждого своя доля и свой долг</div></div></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Кто</th><th class="num">Занятий</th><th class="num">Начислено</th><th class="num">Оплачено</th><th class="num">Долг</th><th>Последнее</th><th></th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(r => `<tr>
          <td><b>${esc(r.name)}</b> ${Object.keys(r.groups).map(g => '<span class="badge badge-g">' + esc(g) + '</span>').join(' ')}</td>
          <td class="num">${r.n}</td>
          <td class="num">${money(r.charged)}</td>
          <td class="num">${money(r.paid)}</td>
          <td class="num"><b style="${r.debt ? 'color:var(--st-crit)' : 'color:var(--st-good)'}">${money(r.debt)}</b></td>
          <td class="nowrap muted small">${r.last ? fmtDate(parseKey(r.last)) : ''}</td>
          <td>${r.debt ? '<button class="btn btn-sm" data-payall="' + r.id + '">Закрыть долг</button>' : '<span class="badge badge-good">✓</span>'}</td>
        </tr>`).join('') : '<tr><td colspan="7" class="muted">Пока нет проведённых занятий</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><div><div class="card-title">Неоплаченные занятия</div>
      <div class="card-sub">Нажмите ₽, чтобы отметить оплату</div></div></div>
    <div class="tbl-wrap" style="max-height:460px;overflow-y:auto">
      <table class="tbl"><tbody>
      ${owed.length ? owed.slice(0, 150).map(x => `<tr>
        <td class="nowrap">${fmtDate(parseKey(x.o.date))} <span class="muted">${DAYS_SHORT[wdIdx(parseKey(x.o.date))]}</span></td>
        <td class="nowrap muted">${esc(x.o.time)}</td>
        <td>${subjBadge(x.o.subject)}</td>
        <td><b>${esc((student(x.id) || {}).name || 'Ученик')}</b>${x.o.kind === 'group' ? ' <span class="badge badge-g">' + esc(targetName(x.o.kind, x.o.refId)) + '</span>' : ''}</td>
        <td><span class="badge ${STATUS[x.o.st].cls}">${STATUS[x.o.st].icon} ${STATUS[x.o.st].label}</span></td>
        <td class="num nowrap">${money(x.o.perOne)}</td>
        <td><button class="pay-btn" data-pay1="${esc(x.o.id)}" data-sid="${esc(x.id)}">₽ оплачено</button></td>
      </tr>`).join('') : '<tr><td class="muted">Долгов нет — красота 🎉</td></tr>'}
      </tbody></table>
    </div>
  </div>`;

  $$('[data-pay1]').forEach(b => b.onclick = () => {
    const o = occ.find(x => x.id === b.dataset.pay1); if (!o) return;
    setPaid(o, b.dataset.sid, true); toast('Оплата отмечена'); render();
  });
  $$('[data-payall]').forEach(b => b.onclick = () => {
    const sid = b.dataset.payall;
    const list = occ.filter(o => o.members.indexOf(sid) >= 0 && !o.payMap[sid]);
    const sum = list.reduce((a, o) => a + o.perOne, 0);
    const who = (student(sid) || {}).name || 'ученика';
    confirmBox('Отметить оплаченными ' + list.length + ' ' + plural(list.length, 'занятие', 'занятия', 'занятий')
      + ' у ' + who + ' на сумму ' + money(sum) + '?', () => {
      list.forEach(o => setPaid(o, sid, true)); render(); toast('Долг закрыт: ' + money(sum));
    }, 'Да, оплачено');
  });
  $('#expDebt').onclick = () => exportOcc(unpaid, 'dolgi_' + todayKey() + '.csv');
}

/* =========================================================

function exportOcc(list, filename) {
  const head = ['Дата', 'День', 'Время', 'Предмет', 'Кто', 'Класс/состав', 'Тип', 'Статус', 'Оплачено', 'Цена', 'Начислено', 'Заметка'];
  const rows = list.map(o => [
    o.date, DAYS_SHORT[wdIdx(parseKey(o.date))], o.time, o.subject,
    targetName(o.kind, o.refId), targetGrade(o.kind, o.refId),
    o.kind === 'group' ? 'группа' : 'индивид.',
    STATUS[o.st].label, isCharged(o) ? (o.paid ? 'да' : 'нет') : '—',
    o.price, isCharged(o) ? o.price : 0, (o.note || '').replace(/\s+/g, ' ')
  ]);
  const t = totals(list);
  rows.push([]);
  rows.push(['ИТОГО', '', '', '', '', '', '', t.lessons + ' проведено', 'получено ' + t.received, '', t.charged, 'долг ' + t.debt]);
  const csv = [head].concat(rows).map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  download(filename, csv, 'csv');
  toast('Файл выгружен: ' + filename);
}

function exportStudentsCsv() {

  const rows = DB.students.map(s => {
    const t = studentStats(s.id);
    return [s.name, s.grade || '', (s.subjects || []).join('+'), s.price || DB.settings.defaultPrice, s.goal || '',
    slotsOf('student', s.id).map(slotLine).join(' / '), t.lessons, t.charged, t.debt, (s.note || '').replace(/\s+/g, ' ')];
  });
  const csv = [head].concat(rows).map(r => r.map(c => {
    const v = String(c == null ? '' : c); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(';')).join('\r\n');
  download('ucheniki_' + todayKey() + '.csv', csv, 'csv');
  toast('Список учеников выгружен');
}

/** Проставить всем ученикам и группам цены по умолчанию из настроек */
function applyDefaultPrices() {
  DB.students.forEach(s => { s.price = DB.settings.defaultPrice; });
  DB.groups.forEach(g => { g.perStudent = DB.settings.groupPrice; });
  DB.slots.forEach(sl => { sl.price = defaultPriceFor(sl.kind, sl.refId, sl.dur); });
  save();
}

/** Стереть все отметки посещаемости и оплат, оставив учеников и расписание */
function clearMarks() {
  DB.marks = {};
  save();
}

/* =========================================================
   РОУТЕР И ЗАПУСК
   ========================================================= */
const VIEWS = { dash: viewDash, week: viewWeek, students: viewStudents, prog: viewProgress, money: viewMoney, mat: viewMaterials, settings: viewSettings };

let pendingRender = false;
/** Пока пользователь печатает в поле — страницу не перерисовываем, иначе теряется фокус */
function isTyping() {
  const a = document.activeElement;
  if (!a) return false;
  const app = document.getElementById('app');
  return /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app && app.contains(a);
}
function render(force) {
  if (!force && isTyping()) { pendingRender = true; return; }
  pendingRender = false;
  const on = document.getElementById('ownerName');
  if (on && DB) on.textContent = DB.settings.owner;
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === VIEW));
  (VIEWS[VIEW] || viewDash)();
  window.scrollTo({ top: window.scrollY > 200 ? 0 : window.scrollY, behavior: 'instant' });
}
document.addEventListener('focusout', () => {
  if (!pendingRender) return;
  setTimeout(() => { if (pendingRender && !isTyping()) render(); }, 150);
});

function startApp() {
  document.body.classList.remove('auth-mode');
  $('#authScreen').classList.add('hidden');
  $('#btnLogout').classList.toggle('hidden', !cloudOn());
  applyTheme();

  render();
}

function init() {
  DB = defaultDB();
  applyTheme();
  wireUI();
  if (!cloudOn()) { loadLocal(); startApp(); return; }
  AUTH.load();
  if (!AUTH.s) { showAuth(); return; }
  startCloud();
}

function wireUI() {
  $$('#tabs .tab').forEach(t => t.onclick = () => { VIEW = t.dataset.view; render(); });
  $('#btnTheme').onclick = () => { DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render(); };
  $('#btnToday').onclick = () => { weekAnchor = startOfWeek(new Date()); dashMonth = todayKey().slice(0, 7); VIEW = 'week'; render(); };

  $('#overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeModal();
  });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { VIEW = g.dataset.go; render(); }
  });

  $('#btnLogout').onclick = () => confirmBox('Выйти из кабинета? Данные останутся в облаке.', async () => {
    await AUTH.signOut();
    location.reload();
  }, 'Выйти');

  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (VIEW === 'dash') render(); }, 250);
  });

  document.addEventListener('visibilitychange', () => {
    if (!cloudOn() || !AUTH.s) return;
    if (document.visibilityState === 'hidden') { if (SYNC.dirty) SYNC.push(); }
    else SYNC.refreshIfIdle();
  });
  window.addEventListener('online', () => { if (SYNC.dirty) SYNC.push(); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
